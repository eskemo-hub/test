<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — EasyCoder</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html" aria-label="EasyCoder — home">EasyCoder<span class="brand-dot" aria-hidden="true">.</span></a>
      <nav class="site-nav" aria-label="Primary">
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./blog.html">Blog</a></li>
          <li><a href="./pricing.html">Pricing</a></li>
          <li><a href="./dashboard.html">Dashboard</a></li>
          <li>
            <button type="button" class="nav-signout" id="nav-signout">Sign out</button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="dashboard-main">
    <div class="container">
      <div id="verify-banner" class="verify-banner" hidden role="status" aria-live="polite">
        <div class="verify-banner-text">
          <p class="verify-banner-msg">Verify your email to unlock all features.</p>
          <p class="verify-banner-link muted" id="verify-banner-link" hidden></p>
        </div>
        <button type="button" class="btn btn-ghost" id="verify-banner-btn">Resend verification email</button>
      </div>
      <div id="dashboard-root" class="dashboard-grid">
        <p class="dashboard-loading">Loading your dashboard&hellip;</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> EasyCoder.dev</p>
      <p class="muted">A small demo app shipped from an EasyCoder workspace.</p>
    </div>
  </footer>

  <script>
    (function () {
      var el = document.getElementById('year');
      if (el) el.textContent = new Date().getFullYear();
    })();
  </script>
  <script src="./app.js"></script>
</body>
</html>
