<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — test</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html" aria-label="test — home">test<span class="brand-dot" aria-hidden="true">.</span></a>
      <nav class="site-nav" aria-label="Primary">
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./login.html">Sign in</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="auth-main">
    <section class="auth-card">
      <h1 class="auth-title">Create account</h1>
      <p class="auth-sub">Pick an email and a password (8+ characters).</p>

      <form class="auth-form" id="register-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
          <p class="field-hint">At least 8 characters.</p>
        </div>

        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>

      <p class="auth-foot">
        Already have one? <a href="./login.html">Sign in</a>.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> test workspace.</p>
    </div>
  </footer>

  <script>
    (function () {
      var el = document.getElementById('year');
      if (el) el.textContent = new Date().getFullYear();
    })();
  </script>
  <script src="./app.js"></script>
</body>
</html>
