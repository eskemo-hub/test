<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — EasyCoder</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./index.html" aria-label="EasyCoder — home">EasyCoder<span class="brand-dot" aria-hidden="true">.</span></a>
      <nav class="site-nav" aria-label="Primary">
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./register.html">Create account</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="auth-main">
    <section class="auth-card">
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-sub">Welcome back. Enter your email and password.</p>

      <form class="auth-form" id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" />
        </div>

        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
      </form>

      <p class="auth-foot">
        No account yet? <a href="./register.html">Create one</a>.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> EasyCoder.dev</p>
      <p class="muted">A small demo app shipped from an EasyCoder workspace.</p>
    </div>
  </footer>

  <script>
    (function () {
      var el = document.getElementById('year');
      if (el) el.textContent = new Date().getFullYear();
    })();
  </script>
  <script src="./app.js"></script>
</body>
</html>
